name: Test staged Conda package

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA used by the successful staging build
        required: true
        type: string
      version:
        description: Exact staged version
        required: true
        type: string
      build_number:
        description: Exact staged build number
        required: true
        type: number
      staging_run_id:
        description: Successful staging workflow run with producer receipts
        required: true
        type: number

permissions:
  contents: read
  actions: read

jobs:
  verify-producer:
    name: Verify the immutable producer evidence
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.receipts.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Require published runtime closure
        shell: bash
        run: python devtools/dependency_preflight.py --release

      - name: Confirm the verifier comes from the candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Download and verify the exact staging run receipts
        id: receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
          gh run download "$STAGING_RUN_ID" --dir "$RUNNER_TEMP/staging-evidence"
          sha256="$(python devtools/conda-build/verify_staged_install.py receipts \
            --run "$RUNNER_TEMP/staging-run.json" \
            --evidence-dir "$RUNNER_TEMP/staging-evidence" \
            --sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION" \
            --build-number "$BUILD_NUMBER" --run-id "$STAGING_RUN_ID")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Inspect the exact staged artifact before any installation
        # Digest, embedded version identities and package-critical resources of the
        # very file the receipts name (uibcdf/sabueso#77).
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA256: ${{ steps.receipts.outputs.sha256 }}
        run: |
          set -euo pipefail
          file="sabueso-${CANDIDATE_VERSION}-py_${BUILD_NUMBER}.tar.bz2"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" \
            "https://conda.anaconda.org/uibcdf/label/staging/noarch/$file"
          python devtools/conda-build/verify_staged_install.py archive \
            --path "$RUNNER_TEMP/$file" --sha256 "$EXPECTED_SHA256" \
            --version "$CANDIDATE_VERSION"

  install:
    name: Install ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: verify-producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Require published runtime closure
        shell: bash
        run: python devtools/dependency_preflight.py --release

      - name: Verify Apple Silicon macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Confirm the install smoke comes from the candidate commit
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Create a clean environment from the exact staged build
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: candidate
          condarc: |
            channels:
              - uibcdf/label/staging
              - uibcdf
              - conda-forge
            # Staging also holds SMonitor and PyUnitWizard builds; strict priority
            # masks the public builds in libmamba even with a channel qualifier.
            channel_priority: flexible
          create-args: >-
            python=${{ matrix.python }}
            uibcdf/label/staging::sabueso=${{ inputs.version }}=py_${{ inputs.build_number }}
            uibcdf::pyunitwizard=0.27.0=py_0
            uibcdf::argdigest=0.13.0=py_1
            uibcdf::depdigest=0.11.0=py_2
            uibcdf::smonitor=0.17.0=py_0
            uibcdf::ackredit=0.9.0=py_0
            pytest>=8
            nbformat>=5
            uibcdf::pytest-receptor=1.2.0
      - name: Verify installed artifact and smoke test outside the source checkout
        shell: bash -l {0}
        env:
          EXPECTED_SHA256: ${{ needs.verify-producer.outputs.sha256 }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -euo pipefail
          checker="$GITHUB_WORKSPACE/devtools/conda-build/verify_staged_install.py"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd "$(cygpath -u "$RUNNER_TEMP")"
          else
            cd "$RUNNER_TEMP"
          fi
          python "$checker" installed --prefix "$CONDA_PREFIX" \
            --sha256 "$EXPECTED_SHA256" --version "$CANDIDATE_VERSION" \
            --build-number "$BUILD_NUMBER" --python-version "$PYTHON_VERSION"
      - name: Exercise required attribution and source traceability on the installed file
        shell: bash -l {0}
        run: |
          set -euo pipefail
          # Only public fixtures and unchanged tests enter this directory. Neither
          # consumer nor provider is replaced by a checkout/source overlay (#110).
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            client_dir="$(cygpath -u "$RUNNER_TEMP")/sabueso-installed-attribution"
          else
            client_dir="$RUNNER_TEMP/sabueso-installed-attribution"
          fi
          mkdir -p "$client_dir"
          cp "$GITHUB_WORKSPACE/tests/core/test_attribution_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_source_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_ncbi_taxonomy_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_rcsb_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_chembl_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_indication_bibliography_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_clinicaltrials_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_pubchem_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_bindingdb_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_chemical_identity_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_pdbe_kb_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_alphafold_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_interpro_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_mondo_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_disease_lookup_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_disease_source_acquisition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_disease_explanation_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_disease_deck_support_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_disease_deck_admission_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_knowledge_state_explanation_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_molecule_knowledge_state_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_bioactivity_explanation_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_ligand_explanation_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_oligomer_explanation_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_rule_literature_extraction_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_literature_intake_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_article_metadata_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_persisted_pipeline_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_user_journeys_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_molecule_target_journey_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_clinical_bibliography_journey_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_disease_entities_journey_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_residue_knowledge_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_residue_tracks_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_residue_composition_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/core/test_hk2_test_system_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/tools/test_uniprot_isoforms_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/tools/test_uniparc_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/tools/test_sequence_candidates_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/tools/test_source_snapshot_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/tests/tools/test_card_notebook_offline.py" "$client_dir/"
          cp "$GITHUB_WORKSPACE/conftest.py" "$client_dir/"
          mkdir -p "$client_dir/devguide/sources" "$client_dir/tools"
          cp "$GITHUB_WORKSPACE/devguide/sources/fixture_delivery.json" "$client_dir/devguide/sources/"
          cp "$GITHUB_WORKSPACE/tools/build_hk2_test_system.py" "$client_dir/tools/"
          mkdir -p "$client_dir/examples/persisted_pipeline"
          cp "$GITHUB_WORKSPACE/examples/persisted_pipeline/run.py" "$client_dir/examples/persisted_pipeline/"
          mkdir -p "$client_dir/examples/user_journeys"
          cp "$GITHUB_WORKSPACE/examples/user_journeys/protein_comparison.py" "$client_dir/examples/user_journeys/"
          cp "$GITHUB_WORKSPACE/examples/user_journeys/molecule_target.py" "$client_dir/examples/user_journeys/"
          cp "$GITHUB_WORKSPACE/examples/user_journeys/clinical_bibliography.py" "$client_dir/examples/user_journeys/"
          cp "$GITHUB_WORKSPACE/examples/user_journeys/disease_entities.py" "$client_dir/examples/user_journeys/"
          cp -R "$GITHUB_WORKSPACE/temp_data" "$client_dir/temp_data"
          cd "$client_dir"
          python -m pytest test_attribution_offline.py test_source_acquisition_offline.py test_rcsb_acquisition_offline.py test_chembl_acquisition_offline.py test_pubchem_acquisition_offline.py test_bindingdb_acquisition_offline.py test_chemical_identity_acquisition_offline.py test_pdbe_kb_acquisition_offline.py test_alphafold_acquisition_offline.py test_interpro_acquisition_offline.py test_disease_explanation_offline.py test_knowledge_state_explanation_offline.py test_molecule_knowledge_state_offline.py test_bioactivity_explanation_offline.py test_ligand_explanation_offline.py test_oligomer_explanation_offline.py test_rule_literature_extraction_offline.py test_literature_intake_offline.py test_article_metadata_offline.py test_persisted_pipeline_offline.py \
            test_user_journeys_offline.py test_molecule_target_journey_offline.py test_clinical_bibliography_journey_offline.py test_disease_entities_journey_offline.py test_disease_deck_support_offline.py test_disease_deck_admission_offline.py test_mondo_acquisition_offline.py test_disease_source_acquisition_offline.py test_disease_lookup_acquisition_offline.py test_indication_bibliography_offline.py test_clinicaltrials_acquisition_offline.py \
            test_ncbi_taxonomy_acquisition_offline.py \
            test_residue_knowledge_offline.py test_residue_tracks_offline.py test_residue_composition_offline.py test_hk2_test_system_offline.py test_uniprot_isoforms_offline.py test_uniparc_offline.py test_sequence_candidates_offline.py test_source_snapshot_offline.py test_card_notebook_offline.py -m "not online" --receptor=ci
          python "$GITHUB_WORKSPACE/examples/ackredit_pilot/run.py" \
            --fixtures temp_data --output pilot
